# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration for Axiora Pulse.
#
# The sqlalchemy.url is intentionally left empty here — it is set
# programmatically in alembic/env.py from settings.database_url so there
# is a single source of truth (.env / config.py).
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate new migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps in migration file headers
timezone = UTC

# Max length of the "slug" part of auto-generated filenames
truncate_slug_length = 40

# Left empty — overridden in alembic/env.py via settings.database_url
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
