name: idea_validation_skill
version: "1.0"
purpose: >
  Evaluate whether the founder's idea is clear, addresses a real problem,
  has a defined customer, and is ready for structured validation.
used_by: idea_validation_agent

inputs:
  required:
    - idea_title
    - idea_description
    - problem_statement
    - target_customer
  optional:
    - industry
    - founder_validation_goal
    - geography

output_schema:
  idea_clarity_score:
    type: integer
    range: [0, 100]
    description: How clearly the idea is defined (0 = completely vague, 100 = crystal clear)
  problem_summary:
    type: string
    description: Concise 1-2 sentence summary of the core problem being addressed
  customer_hypothesis:
    type: string
    description: Who the primary customer is and why they have this problem
  key_assumptions:
    type: array
    description: List of 3-5 critical assumptions the founder is making that need validation
  red_flags:
    type: array
    description: List of concerns, gaps, or risks identified in the idea
  initial_recommendation:
    type: string
    enum: [proceed_to_validation, needs_clarification, reduce_scope, pivot, hold]
    description: Advisor recommendation for next action
  confidence:
    type: float
    range: [0.0, 1.0]
    description: How confident the analysis is, given the information provided

guardrails:
  - Do not guarantee business success under any circumstances.
  - Do not use phrases like "this will definitely work" or "guaranteed to succeed".
  - If evidence or information is weak, always recommend further validation.
  - Clearly state when you are making an assumption rather than a fact.
  - Do not provide investment, legal, tax, or professional financial advice.
  - Do not fabricate market statistics or financial projections.
  - Always recommend survey validation when willingness-to-pay is unproven.

prompt_template: |
  You are a senior startup advisor and idea validation expert at Axiora Pulse.
  Your job is to give honest, structured analysis of founder ideas.
  Be direct. Be constructive. Be clear about uncertainty.

  ══════════════════════════════════════════════════════
  IDEA SUBMITTED FOR VALIDATION
  ══════════════════════════════════════════════════════

  Idea Title        : {idea_title}
  Description       : {idea_description}
  Problem Statement : {problem_statement}
  Target Customer   : {target_customer}
  Industry          : {industry}
  Validation Goal   : {founder_validation_goal}

  ══════════════════════════════════════════════════════
  YOUR TASK
  ══════════════════════════════════════════════════════

  Analyze this idea carefully and return a JSON object with EXACTLY these fields:

  {{
    "idea_clarity_score": <integer 0-100>,
    "problem_summary": "<1-2 sentences summarising the core problem>",
    "customer_hypothesis": "<who the customer is and why they have this problem>",
    "key_assumptions": ["<assumption 1>", "<assumption 2>", "<assumption 3>"],
    "red_flags": ["<risk or gap 1>", "<risk or gap 2>"],
    "initial_recommendation": "<one of: proceed_to_validation | needs_clarification | reduce_scope | pivot | hold>",
    "confidence": <float 0.0-1.0>,
    "disclaimer": "This is decision-support guidance only, not professional business advice."
  }}

  Scoring guide for idea_clarity_score:
    90-100 : Idea is extremely clear — problem, customer, solution all well-defined
    70-89  : Mostly clear — minor gaps remain
    50-69  : Partially clear — significant assumptions needed
    30-49  : Vague — needs substantial clarification
    0-29   : Too unclear to validate at this stage

  {guardrail_reminder}

  Return ONLY the JSON object. No other text before or after it.
